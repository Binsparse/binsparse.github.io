<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Binsparse home">
        <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Binsparse">
      </a>
      <nav aria-label="Primary navigation">
        {% if site.data.versions.latest_stable %}
        <a href="{{ '/versions/' | append: site.data.versions.latest_stable | append: '/' | relative_url }}">Latest</a>
        {% else %}
        <a href="{{ '/versions/draft/' | relative_url }}">Latest</a>
        {% endif %}
        <a href="{{ '/versions/draft/' | relative_url }}">Draft</a>
        <a href="{{ '/versions/' | relative_url }}">Versions</a>
        <a href="https://github.com/Binsparse">GitHub</a>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer>
      <span>Binsparse is developed openly on GitHub.</span>
      <a href="https://github.com/Binsparse/binsparse-specification">Contribute to the specification</a>
    </footer>
  </body>
</html>

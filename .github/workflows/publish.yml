name: Publish specification website

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - specification-updated
  workflow_dispatch:

concurrency:
  group: specification-pages
  cancel-in-progress: false

jobs:
  build_website:
    name: Build specification website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Check out specification
        uses: actions/checkout@v4
        with:
          repository: Binsparse/binsparse-specification
          path: specification

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Build website
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC_REPOSITORY: Binsparse/binsparse-specification
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: |
          python scripts/build_spec_site.py specification/spec/draft/index.bs \
            --template site \
            --output _site_source

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build pages with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_source
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy_website:
    name: Deploy specification website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_website
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
